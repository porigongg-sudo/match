<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィール設定 - MyProf</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>プロフィール設定</h1>
        <form id="profileForm">
            <div class="form-group">
                <label for="username">ユーザー名:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="bio">自己紹介:</label>
                <textarea id="bio" name="bio" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label>メインモード設定:</label>
                <div class="mode-selection">
                    <input type="radio" id="mode-play" name="main_mode" value="play" checked>
                    <label for="mode-play">遊び</label>
                    <input type="radio" id="mode-business" name="main_mode" value="business">
                    <label for="mode-business">ビジネス</label>
                </div>
            </div>
            <button type="submit">保存して次へ</button>
            <p><a href="user_list.html">マッチングリストへ</a></p>
        </form>
    </div>
</body>
</html>
