<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ユーザー詳細 - クラウドマッチ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-container">
        <h1>🤝 クラウドマッチ（簡易版）</h1>
        <nav style="display: flex; align-items: center; gap: 10px">
          <button
            id="dark-mode-toggle"
            class="btn-sub"
            style="font-size: 16px; padding: 6px 12px"
          >
            🌙
          </button>
          <a href="/user_list" class="btn-sub">ユーザー一覧</a>
          <a href="/" class="btn-sub">ホーム</a>
        </nav>
      </div>
    </header>

    <main class="container" style="flex-direction: column; gap: 20px">
      <section class="content" style="max-width: 900px; width: 100%">
        <div class="user-card">
          <div class="user-header">
            <div class="avatar-sample"></div>
            <div>
              <h3>田中 太郎</h3>
              <p class="user-title">Webアプリケーションエンジニア</p>
            </div>
          </div>
          <p class="user-bio">
            Node.jsとMongoDBを使ったマッチングサービスの開発が得意です。API設計からフロントまで対応できます。
          </p>
          <div class="user-skills" style="margin-bottom: 20px">
            <span>JavaScript</span>
            <span>Node.js</span>
            <span>MongoDB</span>
            <span>React</span>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 10px">
            <a href="/message" class="btn-main" style="text-decoration: none"
              >メッセージを送る</a
            >
            <a
              href="/profile_edit"
              class="btn-sub"
              style="text-decoration: none"
              >プロフィール編集</a
            >
          </div>
        </div>
        <div class="user-card" style="padding: 20px">
          <h3>実績</h3>
          <ul
            style="margin-top: 12px; color: var(--text-sub); line-height: 1.8"
          >
            <li>マッチングプラットフォームのバックエンド構築</li>
            <li>GraphQL APIの導入・運用</li>
            <li>レスポンシブデザインによるUI改善</li>
          </ul>
        </div>
      </section>
    </main>

    <script>
      const toggleBtn = document.getElementById("dark-mode-toggle");
      if (localStorage.getItem("darkMode") === "enabled") {
        document.body.classList.add("dark-mode");
        toggleBtn.textContent = "☀️";
      }
      toggleBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");
        if (document.body.classList.contains("dark-mode")) {
          toggleBtn.textContent = "☀️";
          localStorage.setItem("darkMode", "enabled");
        } else {
          toggleBtn.textContent = "🌙";
          localStorage.setItem("darkMode", "disabled");
        }
      });
    </script>
  </body>
</html>
